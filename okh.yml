# Open Know-How (OKH) Manifest for the Custom Braille Embosser
# Compliant with the Open Know-How Specification (Internet of Production Alliance, 2022)
# Spec: https://standards.internetofproduction.org/pub/okh
# Generator reference: https://okh.makernet.org/form

okhv: OKH-LOSHv1.0

name: Custom Braille Embosser
repo: https://github.com/BrennenJohnston/custom-braille-embosser-3d-printing-project
version: 1.0.0
release: https://github.com/BrennenJohnston/custom-braille-embosser-3d-printing-project/releases/tag/v1.0.0
license:
  hardware: CERN-OHL-W-2.0
  documentation: CC-BY-SA-4.0
  software: GPL-3.0-or-later
licensor:
  name: Brennen Johnston
  contact:
    name: Brennen Johnston
documentation-language: en
function: |
  A fully 3D-printed, hand-operated braille embosser. The user feeds card stock between
  two interchangeable cylindrical plates - an embossing plate (with raised dots forming
  the desired braille text) and a universal counter plate (with matching cavities) -
  then squeezes the handle to produce permanent, raised, Grade-1 or Grade-2 braille on
  the card. The embossing plates are produced separately from this repository using the
  parametric OpenSCAD or browser-based generators in the companion repositories.
  No off-the-shelf parts, fasteners, springs, or electronics are required.

documentation-readiness-level: ODRL-3*
technology-readiness-level: OTRL-5

manufacturing-instructions: ./Documentation/Custom_Braille_Embosser_Maker_Guide.pdf
